
name: Tests

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run GdUnit4 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GdUnit4 tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          project_dir: './legacy-of-the-forge/'
          godot-version: '4.7'
          version: installed
          paths: 'res://tests'
          timeout: 10
          arguments: '--continue'
